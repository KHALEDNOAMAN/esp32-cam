<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 CAM</title>
<style>
body{margin:0;background:#0d0d0d;color:#e0e0e0;font-family:monospace}
h2{color:#00e5ff;margin:12px;text-align:center}
#wrap{display:flex;flex-wrap:wrap;gap:16px;padding:12px;justify-content:center;align-items:flex-start}
#left{display:flex;flex-direction:column;align-items:center;flex:1 1 360px;min-width:300px}
#stream{max-width:100%;border:2px solid #00e5ff;border-radius:4px;background:#111;min-height:160px}
#fps{color:#00e5ff;font-size:12px;margin:4px}
#panel{flex:0 1 340px;min-width:280px;background:#1a1a1a;padding:12px;border-radius:6px;box-sizing:border-box}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;justify-content:center}
button{background:#00e5ff;color:#000;border:0;padding:8px 16px;font-size:13px;font-family:monospace;cursor:pointer;border-radius:4px;font-weight:bold}
button:hover{background:#00b8d4}
button.red{background:#ff5252;color:#fff}
.grp{border:1px solid #333;border-radius:4px;padding:8px;margin-bottom:10px}
.grp legend{color:#00e5ff;font-size:12px;padding:0 4px}
.row{display:flex;align-items:center;justify-content:space-between;margin:6px 0;gap:8px}
.row label{font-size:12px;flex:0 0 38%}
.row input[type=range]{flex:1 1 auto;accent-color:#00e5ff}
.row select{flex:1 1 auto;background:#222;color:#e0e0e0;border:1px solid #444;border-radius:3px;padding:3px;font-family:monospace}
.row .val{flex:0 0 32px;text-align:right;font-size:11px;color:#aaa}
.switch{position:relative;display:inline-block;width:40px;height:20px}
.switch input{display:none}
.slider{position:absolute;cursor:pointer;inset:0;background:#444;border-radius:20px;transition:.2s}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:#00e5ff}
input:checked+.slider:before{transform:translateX(20px)}
#info{font-size:11px;color:#aaa;white-space:pre-wrap;margin-top:8px;background:#111;padding:8px;border-radius:4px}
</style>
</head>
<body>
<h2 id="title">&#128247; ESP32 CAM</h2>
<div id="wrap">
  <div id="left">
    <img id="stream" src="">
    <div id="fps"></div>
    <div class="btns">
      <button id="toggle-stream" onclick="toggleStream()">&#9654; Stream</button>
      <button onclick="window.open('/capture?t='+Date.now())">&#128247; Snapshot</button>
      <button onclick="fetch('/save').then(r=>r.json()).then(d=>info(d)).catch(e=>info(''+e))">&#128190; Save SD</button>
      <input id="rec-sec" type="number" min="1" max="30" value="10" title="duration (sec)" style="width:48px;background:#222;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:7px;font-family:monospace">
      <button id="rec-btn" onclick="record()">&#127909; Record</button>
      <button onclick="fetch('/status').then(r=>r.json()).then(d=>info(d)).catch(e=>info(''+e))">&#128202; Status</button>
      <button id="ws-btn" onclick="wsTest()">&#128268; WS Test</button>
    </div>
    <pre id="info">Ready.</pre>
  </div>

  <div id="panel">
    <fieldset class="grp"><legend>Resolution</legend>
      <div class="row"><label>Resolution</label>
        <select id="framesize">
          <option value="15">UXGA 1600x1200</option>
          <option value="14">SXGA 1280x1024</option>
          <option value="13">HD 1280x720</option>
          <option value="12">XGA 1024x768</option>
          <option value="11">SVGA 800x600</option>
          <option value="10">VGA 640x480</option>
          <option value="9">HVGA 480x320</option>
          <option value="8">CIF 400x296</option>
          <option value="6">QVGA 320x240</option>
          <option value="5">240x240</option>
          <option value="4">HQVGA 240x176</option>
          <option value="3">QCIF 176x144</option>
          <option value="1">QQVGA 160x120</option>
          <option value="0">96x96</option>
        </select>
      </div>
      <div class="row"><label>Quality</label>
        <input type="range" id="quality" min="4" max="63" step="1"><span class="val"></span>
      </div>
    </fieldset>

    <fieldset class="grp"><legend>Image</legend>
      <div class="row"><label>Brightness</label><input type="range" id="brightness" min="-2" max="2" step="1"><span class="val"></span></div>
      <div class="row"><label>Contrast</label><input type="range" id="contrast" min="-2" max="2" step="1"><span class="val"></span></div>
      <div class="row"><label>Saturation</label><input type="range" id="saturation" min="-2" max="2" step="1"><span class="val"></span></div>
      <div class="row"><label>Special Effect</label>
        <select id="special_effect">
          <option value="0">No Effect</option>
          <option value="1">Negative</option>
          <option value="2">Grayscale</option>
          <option value="3">Red Tint</option>
          <option value="4">Green Tint</option>
          <option value="5">Blue Tint</option>
          <option value="6">Sepia</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="grp"><legend>White Balance</legend>
      <div class="row"><label>AWB</label><label class="switch"><input type="checkbox" id="awb"><span class="slider"></span></label></div>
      <div class="row"><label>AWB Gain</label><label class="switch"><input type="checkbox" id="awb_gain"><span class="slider"></span></label></div>
      <div class="row"><label>WB Mode</label>
        <select id="wb_mode">
          <option value="0">Auto</option>
          <option value="1">Sunny</option>
          <option value="2">Cloudy</option>
          <option value="3">Office</option>
          <option value="4">Home</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="grp"><legend>Exposure</legend>
      <div class="row"><label>AEC Sensor</label><label class="switch"><input type="checkbox" id="aec"><span class="slider"></span></label></div>
      <div class="row"><label>AEC DSP</label><label class="switch"><input type="checkbox" id="aec2"><span class="slider"></span></label></div>
      <div class="row"><label>AE Level</label><input type="range" id="ae_level" min="-2" max="2" step="1"><span class="val"></span></div>
      <div class="row"><label>Exposure</label><input type="range" id="aec_value" min="0" max="1200" step="1"><span class="val"></span></div>
    </fieldset>

    <fieldset class="grp"><legend>Gain</legend>
      <div class="row"><label>AGC</label><label class="switch"><input type="checkbox" id="agc"><span class="slider"></span></label></div>
      <div class="row"><label>Gain</label><input type="range" id="agc_gain" min="0" max="30" step="1"><span class="val"></span></div>
      <div class="row"><label>Gain Ceiling</label><input type="range" id="gainceiling" min="0" max="6" step="1"><span class="val"></span></div>
    </fieldset>

    <fieldset class="grp"><legend>Corrections</legend>
      <div class="row"><label>BPC</label><label class="switch"><input type="checkbox" id="bpc"><span class="slider"></span></label></div>
      <div class="row"><label>WPC</label><label class="switch"><input type="checkbox" id="wpc"><span class="slider"></span></label></div>
      <div class="row"><label>Raw GMA</label><label class="switch"><input type="checkbox" id="raw_gma"><span class="slider"></span></label></div>
      <div class="row"><label>Lens Corr</label><label class="switch"><input type="checkbox" id="lenc"><span class="slider"></span></label></div>
      <div class="row"><label>DCW</label><label class="switch"><input type="checkbox" id="dcw"><span class="slider"></span></label></div>
    </fieldset>

    <fieldset class="grp"><legend>Orientation / Test</legend>
      <div class="row"><label>H-Mirror</label><label class="switch"><input type="checkbox" id="hmirror"><span class="slider"></span></label></div>
      <div class="row"><label>V-Flip</label><label class="switch"><input type="checkbox" id="vflip"><span class="slider"></span></label></div>
      <div class="row"><label>Color Bar</label><label class="switch"><input type="checkbox" id="colorbar"><span class="slider"></span></label></div>
    </fieldset>
  </div>
</div>

<script>
var img=document.getElementById('stream'),streaming=false,fc=0,lt=Date.now();
img.onload=function(){fc++;var n=Date.now();if(n-lt>=1000){document.getElementById('fps').textContent=(fc*1000/(n-lt)).toFixed(1)+' fps';fc=0;lt=n;}};

function info(d){document.getElementById('info').textContent=(typeof d==='string')?d:JSON.stringify(d,null,2);}

function recBtnReset(){var b=document.getElementById('rec-btn');b.disabled=false;b.textContent='🎥 Record';}

function record(){
  var b=document.getElementById('rec-btn');
  var sec=Math.min(30,Math.max(1,parseInt(document.getElementById('rec-sec').value,10)||10));
  b.disabled=true;b.textContent='● Rec '+sec+'s';
  fetch('/record?sec='+sec).then(r=>r.json()).then(d=>info(d)).catch(e=>info(''+e))
    // Fallback: SSE 'video' event normally re-enables the button; this covers
    // a purged/absent SSE socket. Allow recording + upload time before reset.
    .finally(function(){setTimeout(recBtnReset,sec*1000+8000);});
}

// Live recording result via SSE (firmware sends event:video data:sent|upload_failed|error)
function initSSE(){
  if(!window.EventSource)return;
  var es=new EventSource('/sse');
  es.addEventListener('video',function(e){
    recBtnReset();
    if(e.data==='sent')info('🎥 Video sent ✓');
    else if(e.data==='upload_failed')info('🎥 Recorded, Telegram upload failed (kept on SD)');
    else info('🎥 Video error: '+e.data);
  });
}
initSSE();

// WebSocket send/receive test: connects to /ws, expects a 'hello' push (send-test),
// then sends 'ping' and shows the echoed reply (receive-test).
var ws=null;
function wsTest(){
  if(ws&&ws.readyState<=1){ws.close();return;}
  var proto=location.protocol==='https:'?'wss':'ws';
  info('🔌 WS connecting…');
  ws=new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen=function(){info('🔌 WS open — sending ping');ws.send('ping');};
  ws.onmessage=function(e){info('🔌 WS recv: '+e.data);};
  ws.onerror=function(){info('🔌 WS error');};
  ws.onclose=function(){info('🔌 WS closed');ws=null;};
}

function toggleStream(){
  var b=document.getElementById('toggle-stream');
  if(streaming){img.src='';document.getElementById('fps').textContent='';streaming=false;b.textContent='▶ Stream';}
  else{img.src='/stream?t='+Date.now();streaming=true;b.textContent='▦ Stop';}
}

function setConfig(name,value){
  fetch('/control?var='+name+'&val='+value).catch(e=>info(''+e));
}

// Wire every control to /control
document.querySelectorAll('#panel input,#panel select').forEach(function(el){
  var evt=(el.type==='range')?'change':(el.type==='checkbox')?'change':'change';
  el.addEventListener(evt,function(){
    var v=(el.type==='checkbox')?(el.checked?1:0):el.value;
    setConfig(el.id,v);
    var s=el.parentElement.querySelector('.val');
    if(s)s.textContent=el.value;
    updateDeps();
  });
});

// Disable manual exposure/gain when auto is on (mirrors original firmware)
function updateDeps(){
  var aec=document.getElementById('aec').checked;
  document.getElementById('aec_value').disabled=aec;
  var agc=document.getElementById('agc').checked;
  document.getElementById('agc_gain').disabled=agc;
}

function applyStatus(d){
  Object.keys(d).forEach(function(k){
    var el=document.getElementById(k);
    if(!el)return;
    if(el.type==='checkbox')el.checked=!!d[k];
    else el.value=d[k];
    var s=el.parentElement.querySelector('.val');
    if(s)s.textContent=el.value;
  });
  if(d.app_name){
    document.getElementById('title').innerHTML='📷 '+d.app_name;
    document.title=d.app_name;
  }
  updateDeps();
}

fetch('/status').then(r=>r.json()).then(applyStatus).catch(e=>info(''+e));
</script>
</body>
</html>
